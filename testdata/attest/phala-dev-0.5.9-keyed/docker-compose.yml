services:
  capture:
    image: alpine:3.20
    command: sh -c "echo  | base64 -d > /in-cvm.sh && sh /in-cvm.sh"
    environment:
      NONCE_HEX: 000000006aa7683887f6d2202e73ee587734979d8e1a74457277ecbc98b0e56d
      XWING_HEX: 
    ports: ["8080:8080"]
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - /run/log/dstack:/run/log/dstack:ro
      - /sys/firmware/acpi/tables/data/CCEL:/ccel:ro
