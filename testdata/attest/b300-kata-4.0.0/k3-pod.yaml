apiVersion: v1
kind: Pod
metadata:
  name: k3
spec:
  runtimeClassName: kata-qemu-tdx
  terminationGracePeriodSeconds: 5
  automountServiceAccountToken: false
  enableServiceLinks: false
  containers:
  - name: capture
    image: public.ecr.aws/docker/library/alpine@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
    command:
    - sh
    - -c
    - d=/sys/kernel/config/tsm/report/k3; mkdir $d && echo ADxW5L7yLR9fNpcZTITHFNTWDNesTMUmMkp9LEnYFp0AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA== | base64 -d > $d/inblob && while true; do nc -l -p 8080 < $d/outblob; done
    securityContext:
      runAsUser: 0
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
    volumeMounts:
    - name: tsm
      mountPath: /sys/kernel/config
  volumes:
  - name: tsm
    hostPath:
      path: /sys/kernel/config
      type: Directory
  securityContext:
    supplementalGroups: [1, 2, 3, 4, 6, 10, 11, 20, 26, 27]
