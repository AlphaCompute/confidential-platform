# A platform service on the CPU class, as `alpha coco render` takes it: the runtime as a native
# sidecar terminating TLS in front of one container. Images stand in for alpha-runtime and the
# service so that genpolicy can read them when the vector is recorded.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-01994b3e-5c8a-7d3e-9a1b-2c3d4e5f6a7b
  namespace: app-01994b3e-5c8a-7d3e-9a1b-2c3d4e5f6a7b
spec:
  replicas: 1
  selector:
    matchLabels:
      alphacompute.ai/app: 01994b3e-5c8a-7d3e-9a1b-2c3d4e5f6a7b
  template:
    metadata:
      labels:
        alphacompute.ai/app: 01994b3e-5c8a-7d3e-9a1b-2c3d4e5f6a7b
      annotations:
        io.katacontainers.config.hypervisor.cc_init_data: ""
    spec:
      runtimeClassName: kata-qemu-tdx
      securityContext:
        supplementalGroups: [1, 2, 3, 4, 6, 10, 11, 20, 26, 27]
      initContainers:
        - name: alpha-runtime
          image: alpine@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
          restartPolicy: Always
          env:
            - { name: ALPHACOMPUTE_KMS_ENDPOINTS, value: "https://kms-1.example:8443,https://kms-2.example:8443" }
            - { name: ALPHACOMPUTE_KMS_CA_SPKI_SHA256, value: "sha256:c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1" }
            - { name: ALPHACOMPUTE_KMS_REVISIONS, value: "sha256:e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1" }
            - { name: ALPHACOMPUTE_QUOTE_SOURCE, value: coco-aa }
            - { name: ALPHACOMPUTE_TLS_UPSTREAM, value: "127.0.0.1:80" }
          ports:
            - { name: https, containerPort: 8443 }
          startupProbe:
            tcpSocket: { port: 8443 }
            periodSeconds: 5
            failureThreshold: 120
          volumeMounts:
            - { name: alpha-run, mountPath: /run/alpha }
            - { name: alpha-pod, mountPath: /run/alpha-pod, readOnly: true }
      containers:
        - name: app
          image: nginx@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
          resources:
            limits: { cpu: "2", memory: 4096Mi }
      volumes:
        - name: alpha-run
          emptyDir: { medium: Memory, sizeLimit: 1Mi }
        - name: alpha-pod
          downwardAPI:
            items:
              - path: cc_init_data
                fieldRef:
                  fieldPath: metadata.annotations['io.katacontainers.config.hypervisor.cc_init_data']
