apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-01994b3e-5c8a-7d3e-9a1b-2c3d4e5f6a7b
  namespace: app-01994b3e-5c8a-7d3e-9a1b-2c3d4e5f6a7b
spec:
  replicas: 1
  selector:
    matchLabels:
      alphacompute.ai/app: 01994b3e-5c8a-7d3e-9a1b-2c3d4e5f6a7b
  template:
    metadata:
      labels:
        alphacompute.ai/app: 01994b3e-5c8a-7d3e-9a1b-2c3d4e5f6a7b
      annotations:
        io.katacontainers.config.hypervisor.cc_init_data: ''
    spec:
      runtimeClassName: kata-qemu-tdx
      securityContext:
        supplementalGroups:
        - 1
        - 2
        - 3
        - 4
        - 6
        - 10
        - 11
        - 20
        - 26
        - 27
      volumes:
      - name: alpha-run
        emptyDir:
          medium: Memory
          sizeLimit: 1Mi
      - name: alpha-pod
        downwardAPI:
          items:
          - path: cc_init_data
            fieldRef:
              fieldPath: metadata.annotations['io.katacontainers.config.hypervisor.cc_init_data']
      - name: cache
        emptyDir:
          sizeLimit: 10Gi
      initContainers:
      - name: alpha-runtime
        image: alpine@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
        restartPolicy: Always
        env:
        - name: ALPHACOMPUTE_KMS_CA_SPKI_SHA256
          value: sha256:c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1
        - name: ALPHACOMPUTE_KMS_REVISIONS
          value: sha256:e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1,sha256:e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2e2
        - name: ALPHACOMPUTE_QUOTE_SOURCE
          value: coco-aa
        - name: ALPHACOMPUTE_TLS_UPSTREAM
          value: 127.0.0.1:80
        ports:
        - name: https
          containerPort: 8443
        startupProbe:
          tcpSocket:
            port: 8443
          periodSeconds: 5
          failureThreshold: 17280
        securityContext:
          allowPrivilegeEscalation: false
        volumeMounts:
        - name: alpha-run
          mountPath: /run/alpha
        - name: alpha-pod
          mountPath: /run/alpha-pod
          readOnly: true
      containers:
      - name: app
        image: nginx@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
        env:
        - name: DB_PASSWORD
          value: sealed.eyJhbGciOiJFUzI1NiIsImtpZCI6ImticzovLy8wMTk5NGIzZS01YzhhLTdkM2UtOWExYi0yYzNkNGU1ZjZhN2Ivc2VhbGVkLXNlY3JldC1rZXkvc2VhbGluZyJ9.eyJ2ZXJzaW9uIjoiMC4xLjAiLCJ0eXBlIjoidmF1bHQiLCJuYW1lIjoia2JzOi8vLzAxOTk0YjNlLTVjOGEtN2QzZS05YTFiLTJjM2Q0ZTVmNmE3Yi9zZWNyZXQvZGJfcGFzc3dvcmQiLCJwcm92aWRlciI6ImticyIsInByb3ZpZGVyX3NldHRpbmdzIjp7fSwiYW5ub3RhdGlvbnMiOnt9fQ.BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBw
        volumeMounts:
        - name: cache
          mountPath: /var/cache/app
        resources:
          limits:
            cpu: '4'
            memory: 8192Mi
          requests:
            cpu: '4'
            memory: 8192Mi
