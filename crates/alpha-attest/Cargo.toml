[package]
name = "alpha-attest"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
alpha-core = { path = "../alpha-core" }
base64 = "0.23"
hex = { version = "0.4", features = ["serde"] }
p384 = { version = "0.14", default-features = false, features = ["ecdsa", "pkcs8"] }
roxmltree = "0.21.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
x509-parser = "0.18"

# The browser verifier builds without `ring` and the HTTP client, neither of which has a
# wasm32-unknown-unknown build.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dcap-qvl = "=0.6.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
dcap-qvl = { version = "=0.6.3", default-features = false, features = ["std", "rustcrypto", "default-x509"] }
# Only to select the browser's RNG for the copy of getrandom 0.2 that dcap-qvl's ECDSA pulls in.
getrandom-02 = { package = "getrandom", version = "0.2", features = ["js"] }

[dev-dependencies]
chrono = { version = "0.4", default-features = false }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
tokio = { version = "1", features = ["macros", "rt"] }
