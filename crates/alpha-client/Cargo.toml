[package]
name = "alpha-client"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
alpha-attest = { path = "../alpha-attest" }
alpha-core = { path = "../alpha-core" }
alpha-crypto = { path = "../alpha-crypto" }
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["std"] }
ed25519-dalek = { version = "3", features = ["pkcs8", "alloc"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
p256 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
parking_lot = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["net"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["aws-lc-rs", "std"] }
x509-parser = "0.18"
zeroize = "1"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
