[package]
name = "alpha-crypto"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
alpha-core = { path = "../alpha-core" }
base64 = "0.23"
getrandom = "0.4"
hex = { version = "0.4", features = ["serde"] }
hpke = { version = "0.14", default-features = false, features = ["alloc", "getrandom", "mlkem", "x25519", "aes"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = "1"

[dev-dependencies]
hpke = { version = "0.14", default-features = false, features = ["alloc", "getrandom", "mlkem", "x25519", "aes", "chacha"] }
x-wing = { version = "0.1", features = ["hazmat"] }
