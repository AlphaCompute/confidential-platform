[package]
name = "alpha-cli"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "alpha"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.11"
alpha-attest = { path = "../alpha-attest" }
alpha-channel = { path = "../alpha-channel" }
alpha-client = { path = "../alpha-client" }
alpha-core = { path = "../alpha-core" }
alpha-crypto = { path = "../alpha-crypto" }
base64 = "0.23"
flate2 = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = { version = "3", features = ["pkcs8", "alloc"] }
getrandom = "0.4"
hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
rpassword = "7"
scrypt = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"] }
uuid = "1"
zeroize = "1"

[dev-dependencies]
alpha-tsm = { path = "../alpha-tsm" }
axum = { version = "0.8", default-features = false }
# The Kata agent's policy engine, as kata-containers 4.1.0's agent builds it (src/agent/policy):
# the same regorus commit and features, and the json-patch it applies policy state with.
json-patch = "=4.2.0"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }
regorus = { git = "https://github.com/microsoft/regorus", rev = "898643129e3652efd43e596f978d99f85e770235", default-features = false, features = ["arc", "base64", "base64url", "regex", "std"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
