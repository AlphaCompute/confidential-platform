[package]
name = "alpha-cli"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "alpha"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.11"
alpha-attest = { path = "../alpha-attest" }
alpha-client = { path = "../alpha-client" }
alpha-core = { path = "../alpha-core" }
alpha-crypto = { path = "../alpha-crypto" }
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = { version = "3", features = ["pkcs8", "alloc"] }
getrandom = "0.4"
hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
rpassword = "7"
scrypt = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
zeroize = "1"
