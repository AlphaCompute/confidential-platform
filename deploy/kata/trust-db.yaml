# The trust-zone Postgres: an ordinary runc pod on its own node pool, treated as untrusted storage.
# Everything secret in it is ciphertext under keys it never sees.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-hba
  namespace: alpha-trust-db
data:
  # Over the network only TLS with SCRAM; the socket is reachable only through `kubectl exec`.
  # The base backup streams over a replication connection.
  pg_hba.conf: |
    local all postgres trust
    hostssl all all all scram-sha-256
    hostssl replication postgres all scram-sha-256
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: alpha-trust-db
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
  - {name: postgres, port: 5432}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: alpha-trust-db
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        alphacompute.io/pool: trust-db
      tolerations:
      - {key: alphacompute.io/pool, operator: Equal, value: trust-db, effect: NoSchedule}
      securityContext:
        # The image's postgres group: Postgres accepts a root-owned key only as 0640 with its group.
        fsGroup: 999
      initContainers:
      - name: wal-g
        image: curlimages/curl:8.23.0@sha256:a134550be58ab783810e613ae96fd253c38f7bdd16d9bf9be350700c7a29ac06
        command:
        - sh
        - -ec
        - |
          curl -fsSLo /wal-g/wal-g https://github.com/wal-g/wal-g/releases/download/v3.0.9/wal-g-pg-24.04-amd64
          echo '8015836f246a978f27b31a2462eac7765312558ae5b11ac033322b555abf9e22  /wal-g/wal-g' | sha256sum -c
          chmod 755 /wal-g/wal-g
        volumeMounts:
        - {name: wal-g, mountPath: /wal-g}
      containers:
      - name: postgres
        image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        args:
        - -c
        - archive_mode=on
        - -c
        - archive_command=/wal-g/wal-g wal-push %p
        - -c
        - archive_timeout=60
        # Read only while a restored volume's recovery.signal is present.
        - -c
        - restore_command=/wal-g/wal-g wal-fetch %f %p
        - -c
        - ssl=on
        - -c
        - ssl_cert_file=/tls/tls.crt
        - -c
        - ssl_key_file=/tls/tls.key
        - -c
        - hba_file=/hba/pg_hba.conf
        env:
        - {name: POSTGRES_DB, value: alpha}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef: {name: postgres, key: password}
        - {name: WALG_LIBSODIUM_KEY_TRANSFORM, value: hex}
        envFrom:
        - {secretRef: {name: postgres-backup}}
        ports:
        - {name: postgres, containerPort: 5432}
        # Over TCP: the image's first-start server listens only on the socket, so the probe and
        # the migration wait until the database is created.
        readinessProbe:
          exec:
            command: [pg_isready, -h, 127.0.0.1, -U, postgres, -d, alpha]
        volumeMounts:
        - {name: data, mountPath: /var/lib/postgresql}
        - {name: tls, mountPath: /tls, readOnly: true}
        - {name: hba, mountPath: /hba, readOnly: true}
        - {name: wal-g, mountPath: /wal-g, readOnly: true}
      volumes:
      - {name: wal-g, emptyDir: {}}
      - name: tls
        secret: {secretName: postgres-tls, defaultMode: 0640}
      - name: hba
        configMap: {name: postgres-hba}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: ${TRUST_DB_STORAGE_CLASS}
      resources:
        requests:
          storage: ${TRUST_DB_STORAGE_SIZE}
---
# The daily base backup, the roles beside it, then everything older than the 30th base backup goes.
# The roles land in one object per day of the month, so they roll over with the backups.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: alpha-trust-db
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          nodeSelector:
            alphacompute.io/pool: trust-db
          tolerations:
          - {key: alphacompute.io/pool, operator: Equal, value: trust-db, effect: NoSchedule}
          initContainers:
          - name: wal-g
            image: curlimages/curl:8.23.0@sha256:a134550be58ab783810e613ae96fd253c38f7bdd16d9bf9be350700c7a29ac06
            command:
            - sh
            - -ec
            - |
              curl -fsSLo /wal-g/wal-g https://github.com/wal-g/wal-g/releases/download/v3.0.9/wal-g-pg-24.04-amd64
              echo '8015836f246a978f27b31a2462eac7765312558ae5b11ac033322b555abf9e22  /wal-g/wal-g' | sha256sum -c
              chmod 755 /wal-g/wal-g
            volumeMounts:
            - {name: wal-g, mountPath: /wal-g}
          containers:
          - name: backup
            image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
            command:
            - bash
            - -ec
            - |
              set -o pipefail
              /wal-g/wal-g backup-push
              pg_dumpall --globals-only | /wal-g/wal-g st put -f --read-stdin "globals/$(date -u +%d).sql"
              /wal-g/wal-g delete retain FULL 30 --confirm
            env:
            - {name: PGHOST, value: postgres}
            - {name: PGUSER, value: postgres}
            - {name: PGSSLMODE, value: require}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: postgres, key: password}
            - {name: WALG_LIBSODIUM_KEY_TRANSFORM, value: hex}
            envFrom:
            - {secretRef: {name: postgres-backup}}
            volumeMounts:
            - {name: wal-g, mountPath: /wal-g, readOnly: true}
          volumes:
          - {name: wal-g, emptyDir: {}}
