# alpha-model-server: one OpenAI-compatible model on one whole confidential-computing GPU, in a
# Kata TDX pod VM. Rendered per model from models/<name>.env (envsubst-style ${VARS}) by the
# Rafay renderer (PRD-03); everything below except those variables is part of the Revision.
#
# Shape:
#   alpha-runtime   native sidecar: attests, holds the leaf, terminates TLS on :8443 and proxies
#                   to vllm on 127.0.0.1:8000 (an address, not a name); writes the declared
#                   Secret file for vllm.
#   open-weights    init: alpha-weights opens this model's sealed weights into pod-VM memory
#                   under the App's KMS-derived `weights` key, only if their manifest has the
#                   digest this spec names.
#   vllm            stock vLLM, bound to loopback only, accepting only this server's own bearer.
#
# Only alpha-inference reaches vLLM: the runtime admits a TLS client only with an Instance leaf of
# the front's App (ALPHACOMPUTE_TLS_CALLER_APPS), so vLLM's routes outside /v1, which its API key
# does not cover, are closed to everyone else too.
#
# Depends on PRD-02: alpha-runtime's evidence source on Kata (TDX quote + NVIDIA GPU evidence
# instead of the dstack guest agent), and the Revision definition for a pod spec + agent policy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alpha-model-server-${MODEL_NAME}
  labels:
    app.kubernetes.io/name: alpha-model-server
    alphacompute.dev/model: ${MODEL_NAME}
spec:
  replicas: ${REPLICAS}
  strategy:
    # One GPU per pod and no spare GPUs assumed: replace in place.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: alpha-model-server
      alphacompute.dev/model: ${MODEL_NAME}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alpha-model-server
        alphacompute.dev/model: ${MODEL_NAME}
      annotations:
        # Pod VM memory: weights (opened into memory) + vLLM host overhead + the runtime.
        io.katacontainers.config.hypervisor.default_memory: "${POD_VM_MEMORY_MIB}"
        io.katacontainers.config.hypervisor.default_vcpus: "${POD_VM_VCPUS}"
        # Generated by genpolicy from this exact spec and pinned in the Revision (PRD-02): no
        # exec, no logs readback of vllm/open-weights, only these images by digest.
        io.katacontainers.config.agent.policy: "${AGENT_POLICY_B64}"
    spec:
      runtimeClassName: kata-qemu-nvidia-gpu-tdx
      automountServiceAccountToken: false
      enableServiceLinks: false
      initContainers:
        - name: alpha-runtime
          image: ${RUNTIME_IMAGE}            # ghcr.io/alphacompute/alpha-runtime@sha256:...
          restartPolicy: Always            # native sidecar: up before open-weights, alive with vllm
          env:
            - name: ALPHACOMPUTE_KMS_ENDPOINTS
              value: "${KMS_ENDPOINTS}"
            - name: ALPHACOMPUTE_KMS_CA_SPKI_SHA256
              value: "${KMS_CA_SPKI_SHA256}"
            - name: ALPHACOMPUTE_KMS_REVISIONS
              value: "${KMS_REVISIONS}"
            # The loopback address itself, never a name: /etc/hosts in the pod VM is written by
            # the host and not measured, so a name could be pointed anywhere.
            - name: ALPHACOMPUTE_TLS_UPSTREAM
              value: "127.0.0.1:8000"
            # Only an Instance of alpha-inference's App, whatever its Revision (its Revision pins
            # this server's, so this server cannot pin it back).
            - name: ALPHACOMPUTE_TLS_CALLER_APPS
              value: "${INFERENCE_APP_ID}"
            # One bearer per server, so one server's bearer opens no other.
            - name: ALPHACOMPUTE_SECRETS
              value: '{"vllm":["model-server-bearer-${MODEL_NAME}"]}'
          ports:
            - name: https
              containerPort: 8443
          startupProbe:
            exec:
              command: ["/alpha-runtime", "healthcheck"]
            periodSeconds: 5
            failureThreshold: 120
          volumeMounts:
            - { name: runtime-socket, mountPath: /run/alpha }
            - { name: secrets-vllm, mountPath: /run/alpha-secrets/vllm }
        - name: open-weights
          image: ${WEIGHTS_IMAGE}            # ghcr.io/alphacompute/alpha-weights@sha256:...
          # The model and the manifest digest its seal Job printed, pinned here by the agent policy:
          # another model's sealed volume, or an older sealing of this one, does not open.
          args: ["open", "${MODEL_ID}", "${WEIGHTS_MANIFEST_SHA256}", "/sealed", "/weights"]
          volumeMounts:
            - { name: runtime-socket, mountPath: /run/alpha }
            - { name: sealed-weights, mountPath: /sealed, readOnly: true }
            - { name: weights, mountPath: /weights }
      containers:
        - name: vllm
          image: ${VLLM_IMAGE}               # vllm/vllm-openai:<version>@sha256:... (pinned at G0)
          command: ["/bin/sh", "-c"]
          # Loopback only: the sole way in is the runtime's TLS on :8443. The bearer is read
          # from the Secret file into the environment, never onto the command line.
          args:
            - >-
              export VLLM_API_KEY="$(cat /run/secrets/model-server-bearer-${MODEL_NAME})" &&
              exec vllm serve /weights
              --served-model-name "${MODEL_ID}"
              --host 127.0.0.1 --port 8000
              --tensor-parallel-size 1
              --max-model-len ${MAX_MODEL_LEN}
              ${VLLM_EXTRA_ARGS}
          env:
            - { name: HF_HUB_OFFLINE, value: "1" }
            - { name: VLLM_NO_USAGE_STATS, value: "1" }
            - { name: DO_NOT_TRACK, value: "1" }
          resources:
            limits:
              nvidia.com/pgpu: 1             # one whole GPU in CC mode, passed through to the pod VM
          readinessProbe:
            # The kubelet probes from the node, so 127.0.0.1 would be the node's own loopback. The
            # runtime's TLS port is the pod's only open port and answers once attested; whether
            # vLLM serves the model is what alpha-inference checks over TLS before any use.
            tcpSocket: { port: 8443 }
            periodSeconds: 10
            failureThreshold: 60
          volumeMounts:
            - { name: secrets-vllm, mountPath: /run/secrets, readOnly: true }
            - { name: weights, mountPath: /weights, readOnly: true }
            - { name: shm, mountPath: /dev/shm }
      volumes:
        - { name: runtime-socket, emptyDir: { medium: Memory } }
        - { name: secrets-vllm, emptyDir: { medium: Memory, sizeLimit: 1Mi } }
        # Opened weights live in pod-VM memory (TDX-encrypted), never on a host disk.
        - name: weights
          emptyDir: { medium: Memory, sizeLimit: "${WEIGHTS_SIZE}" }
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 16Gi }
        # Sealed with the App's key: safe on host storage.
        - name: sealed-weights
          persistentVolumeClaim:
            claimName: sealed-weights-${MODEL_NAME}
            readOnly: true
---
# Only the runtime's TLS port is published; alpha-inference pins the KMS CA and the Revision.
apiVersion: v1
kind: Service
metadata:
  name: alpha-model-server-${MODEL_NAME}
spec:
  selector:
    app.kubernetes.io/name: alpha-model-server
    alphacompute.dev/model: ${MODEL_NAME}
  ports:
    - { name: https, port: 8443, targetPort: https }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alpha-model-server-${MODEL_NAME}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alpha-model-server
      alphacompute.dev/model: ${MODEL_NAME}
  policyTypes: [Ingress, Egress]
  ingress:
    # Defence in depth only (the host enforces it); the runtime's caller pin and the bearer are
    # the control.
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: alpha-inference } }
      ports: [{ port: 8443 }]
  egress:
    # The KMS only (attestation, the Secret, the weights key) and DNS.
    - to: [{ ipBlock: { cidr: "${KMS_CIDR}" } }]
      ports: [{ port: 443 }, { port: 8443 }]
    - ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
