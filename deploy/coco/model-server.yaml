# alpha-model-server: one OpenAI-compatible model on one whole confidential-computing GPU, in a
# Kata TDX pod VM, in the form PRD-01 admission and the KMS accept.
#
# INTERIM: rendered per model by render-interim.py (cluster.env + models/<name>.env + the
# reviewed agent policy) until `alpha coco render` (PRD-02 PR 6) emits this spec. The script puts
# the agent policy and alpha.json into the pod's init-data, and base64(gzip(init-data)) into the
# one Kata annotation, cc_init_data, whose digest is the TD's MRCONFIGID; the Revision v2 is a
# function of that init-data. No other io.katacontainers.* annotation is set: admission refuses
# them, and the pod VM's memory and vCPUs come from the containers' limits (CPU and memory stay
# out of the Revision; RTMR0 is captured per shape in the reference values).
#
# Shape:
#   alpha-runtime   native sidecar: attests through the CoCo attestation agent with the pod's
#                   init-data, holds the leaf, terminates TLS on :8443 and proxies to vllm on
#                   127.0.0.1:8000 (an address, not a name); writes the declared Secret file for
#                   vllm.
#   open-weights    init: alpha-weights opens this model's sealed weights into pod-VM memory
#                   under the App's KMS-derived `weights` key, only if their manifest has the
#                   digest this spec names.
#   vllm            stock vLLM, bound to loopback only, accepting only this server's own bearer.
#
# Only alpha-inference reaches vLLM: the runtime admits a TLS client only with an Instance leaf of
# the front's App (ALPHACOMPUTE_TLS_CALLER_APPS), so vLLM's routes outside /v1, which its API key
# does not cover, are closed to everyone else too.
#
# Warm: REPLICAS is at least 2 (render-interim.py refuses fewer), every replica the same pod
# template, so the same init-data and the same Revision hash alpha-inference pins. Each replica
# attests and renews its own leaf, and a pod is Ready only while its runtime holds an unexpired
# leaf and vLLM answers /health (weights loaded): the Service sends traffic only to such a pod, so
# losing one, a drain or a rollout never leaves the model cold. The front keeps its check of the
# model warm on its side (alpha-inference keep_warm).
#
# Depends on PRD-02: alpha-runtime's CoCo evidence source (ALPHACOMPUTE_QUOTE_SOURCE, the
# init-data at /run/alpha-pod/cc_init_data) and the KMS's Revision v2 appraisal.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alpha-model-server-${MODEL_NAME}
  labels:
    app.kubernetes.io/name: alpha-model-server
    alphacompute.ai/model: ${MODEL_NAME}
spec:
  replicas: ${REPLICAS}
  strategy:
    # One GPU per pod and no spare GPUs assumed: replace in place, one pod at a time, so the other
    # replicas keep serving while the new one boots, attests and loads its weights. Moving to a new
    # Revision, alpha-inference's MODEL_SERVERS lists both until the rollout is done.
    type: RollingUpdate
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: alpha-model-server
      alphacompute.ai/model: ${MODEL_NAME}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alpha-model-server
        alphacompute.ai/model: ${MODEL_NAME}
        # GPU-hours chargeback (alpha-infra admission/chargeback-labels.yaml).
        alphacompute.ai/tenant: ${TENANT}
        alphacompute.ai/app: ${APP_ID}
      annotations:
        # The only Kata annotation: the init-data (agent policy + alpha.json), set by the renderer.
        io.katacontainers.config.hypervisor.cc_init_data: "${CC_INIT_DATA}"
    spec:
      runtimeClassName: kata-qemu-nvidia-gpu-tdx
      automountServiceAccountToken: false
      enableServiceLinks: false
      initContainers:
        - name: alpha-runtime
          image: ${RUNTIME_IMAGE}            # ghcr.io/alphacompute/alpha-runtime@sha256:...
          restartPolicy: Always            # native sidecar: up before open-weights, alive with vllm
          env:
            - name: ALPHACOMPUTE_KMS_ENDPOINTS
              value: "${KMS_ENDPOINTS}"
            - name: ALPHACOMPUTE_KMS_CA_SPKI_SHA256
              value: "${KMS_CA_SPKI_SHA256}"
            - name: ALPHACOMPUTE_KMS_REVISIONS
              value: "${KMS_REVISIONS}"
            # The TDX quote from the CoCo attestation agent in this pod VM, sent with the
            # init-data below; not the prototype's dstack guest agent.
            - name: ALPHACOMPUTE_QUOTE_SOURCE
              value: "coco-aa"
            # The loopback address itself, never a name: /etc/hosts in the pod VM is written by
            # the host and not measured, so a name could be pointed anywhere.
            - name: ALPHACOMPUTE_TLS_UPSTREAM
              value: "127.0.0.1:8000"
            # Only an Instance of alpha-inference's App, whatever its Revision (its Revision pins
            # this server's, so this server cannot pin it back).
            - name: ALPHACOMPUTE_TLS_CALLER_APPS
              value: "${INFERENCE_APP_ID}"
            # One bearer per server, so one server's bearer opens no other.
            - name: ALPHACOMPUTE_SECRETS
              value: '{"vllm":["model-server-bearer-${MODEL_NAME}"]}'
            # Readiness on :8444 (plain HTTP, GET /ready, empty body): 200 only while the runtime
            # holds an unexpired leaf and vLLM's /health, which needs no key and answers 200 only
            # once the model is loaded, answers 2xx.
            - name: ALPHACOMPUTE_TLS_UPSTREAM_READY
              value: "/health"
          ports:
            - name: https
              containerPort: 8443
            - name: ready
              containerPort: 8444
          # The agent policy refuses exec, so no exec probe could ever pass: the runtime opens
          # 8443 only once it has attested.
          startupProbe:
            tcpSocket: { port: 8443 }
            periodSeconds: 5
            failureThreshold: 120
          volumeMounts:
            - { name: runtime-socket, mountPath: /run/alpha }
            - { name: secrets-vllm, mountPath: /run/alpha-secrets/vllm }
            - { name: pod-initdata, mountPath: /run/alpha-pod, readOnly: true }
        - name: open-weights
          image: ${WEIGHTS_IMAGE}            # ghcr.io/alphacompute/alpha-weights@sha256:...
          # The model and the manifest digest its seal Job printed, pinned here by the agent policy:
          # another model's sealed volume, or an older sealing of this one, does not open.
          args: ["open", "${MODEL_ID}", "${WEIGHTS_MANIFEST_SHA256}", "/sealed", "/weights"]
          volumeMounts:
            - { name: runtime-socket, mountPath: /run/alpha }
            - { name: sealed-weights, mountPath: /sealed, readOnly: true }
            - { name: weights, mountPath: /weights }
      containers:
        - name: vllm
          image: ${VLLM_IMAGE}               # vllm/vllm-openai:<version>@sha256:... (pinned at G0)
          command: ["/bin/sh", "-c"]
          # Loopback only: the sole way in is the runtime's TLS on :8443. The bearer is read
          # from the Secret file into the environment, never onto the command line, and vLLM does
          # not start until the file holds it: without it vLLM would serve with no key at all.
          args:
            - >-
              until [ -s /run/secrets/model-server-bearer-${MODEL_NAME} ]; do sleep 1; done &&
              export VLLM_API_KEY="$(cat /run/secrets/model-server-bearer-${MODEL_NAME})" &&
              exec vllm serve /weights
              --served-model-name "${MODEL_ID}"
              --host 127.0.0.1 --port 8000
              --tensor-parallel-size 1
              --max-model-len ${MAX_MODEL_LEN}
              ${VLLM_EXTRA_ARGS}
          env:
            - { name: HF_HUB_OFFLINE, value: "1" }
            - { name: VLLM_NO_USAGE_STATS, value: "1" }
            - { name: DO_NOT_TRACK, value: "1" }
          resources:
            # The pod VM is sized from these limits (Kata's static sandbox sizing on TDX): the
            # weights opened into memory, vLLM's host-side overhead and /dev/shm.
            limits:
              nvidia.com/pgpu: 1             # one whole GPU in CC mode, passed through to the pod VM
              cpu: "${POD_VM_VCPUS}"
              memory: "${POD_VM_MEMORY_MIB}Mi"
          readinessProbe:
            # The kubelet probes from the node, so 127.0.0.1 would be the node's own loopback, and
            # the agent policy refuses exec: the runtime answers for vLLM on :8444 instead. Not
            # Ready while booting, attesting, opening weights or loading the model, nor once the
            # leaf has expired; three misses take the pod out of the Service. alpha-inference still
            # checks /v1/models over the pinned TLS before any use.
            httpGet: { path: /ready, port: 8444 }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - { name: secrets-vllm, mountPath: /run/secrets, readOnly: true }
            - { name: weights, mountPath: /weights, readOnly: true }
            - { name: shm, mountPath: /dev/shm }
      volumes:
        - { name: runtime-socket, emptyDir: { medium: Memory } }
        - { name: secrets-vllm, emptyDir: { medium: Memory, sizeLimit: 1Mi } }
        # The pod's own init-data, which the runtime sends with its evidence. The host could put
        # anything here; the KMS refuses any init-data that is not the digest in MRCONFIGID.
        - name: pod-initdata
          downwardAPI:
            items:
              - path: cc_init_data
                fieldRef:
                  fieldPath: metadata.annotations['io.katacontainers.config.hypervisor.cc_init_data']
        # Opened weights live in pod-VM memory (TDX-encrypted), never on a host disk.
        - name: weights
          emptyDir: { medium: Memory, sizeLimit: "${WEIGHTS_SIZE}" }
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 16Gi }
        # Sealed with the App's key and bound to this model: safe on host storage.
        - name: sealed-weights
          persistentVolumeClaim:
            claimName: sealed-weights-${MODEL_NAME}
            readOnly: true
---
# Only the runtime's TLS port is published; alpha-inference pins the KMS CA and the Revision.
apiVersion: v1
kind: Service
metadata:
  name: alpha-model-server-${MODEL_NAME}
spec:
  selector:
    app.kubernetes.io/name: alpha-model-server
    alphacompute.ai/model: ${MODEL_NAME}
  ports:
    - { name: https, port: 8443, targetPort: https }
---
# A voluntary disruption (a drain) takes at most one replica at a time.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: alpha-model-server-${MODEL_NAME}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alpha-model-server
      alphacompute.ai/model: ${MODEL_NAME}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alpha-model-server-${MODEL_NAME}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alpha-model-server
      alphacompute.ai/model: ${MODEL_NAME}
  policyTypes: [Ingress, Egress]
  ingress:
    # Defence in depth only (the host enforces it); the runtime's caller pin and the bearer are
    # the control. The readiness port is for the kubelet's probe from the node alone.
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: alpha-inference } }
      ports: [{ port: 8443 }]
  egress:
    # The KMS only (attestation, the Secret, the weights key) and DNS. The attestation agent is
    # inside the pod VM.
    - to: [{ ipBlock: { cidr: "${KMS_CIDR}" } }]
      ports: [{ port: 443 }, { port: 8443 }]
    - ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
