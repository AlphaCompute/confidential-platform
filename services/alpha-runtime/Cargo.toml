[package]
name = "alpha-runtime"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
alpha-attest = { path = "../../crates/alpha-attest" }
alpha-client = { path = "../../crates/alpha-client" }
alpha-core = { path = "../../crates/alpha-core" }
alpha-tsm = { path = "../../crates/alpha-tsm" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["std"] }
getrandom = "0.4"
p256 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
parking_lot = "0.12"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
zeroize = "1"
