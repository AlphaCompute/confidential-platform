[package]
name = "alpha-runtime"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Verifies platform documents under release-keys/dev.pub: the stand's runtime, never a release.
dev = ["alpha-channel/dev"]

[dependencies]
alpha-channel = { path = "../../crates/alpha-channel" }
alpha-attest = { path = "../../crates/alpha-attest" }
alpha-client = { path = "../../crates/alpha-client" }
alpha-core = { path = "../../crates/alpha-core" }
alpha-nvml = { path = "../../crates/alpha-nvml" }
alpha-tsm = { path = "../../crates/alpha-tsm" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["std"] }
flate2 = "1"
getrandom = "0.4"
hkdf = "0.13"
instant-acme = { version = "0.8.5", default-features = false, features = ["aws-lc-rs", "hyper-rustls"] }
p256 = { version = "0.14", features = ["ecdsa", "hash2curve", "pkcs8"] }
parking_lot = "0.12"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
x509-parser = "0.18"
zeroize = "1"

[dev-dependencies]
alpha-channel = { path = "../../crates/alpha-channel", features = ["dev"] }
p384 = { version = "0.14", default-features = false, features = ["ecdsa", "pkcs8"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
