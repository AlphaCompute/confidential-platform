[package]
name = "alpha-kms"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
dev-root = []

[dependencies]
aes-gcm = "0.11"
alpha-attest = { path = "../../crates/alpha-attest" }
alpha-core = { path = "../../crates/alpha-core" }
alpha-crypto = { path = "../../crates/alpha-crypto" }
alpha-tsm = { path = "../../crates/alpha-tsm" }
axum = "0.8"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = { version = "3", features = ["pkcs8", "alloc"] }
getrandom = "0.4"
hex = "0.4"
hkdf = "0.13"
hmac = "0.13"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "server-graceful", "service", "tokio"] }
rand_core = "0.10"
pem = "3"
p256 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
rustls-pki-types = { version = "1", features = ["std"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["aws-lc-rs", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "uuid", "chrono", "json", "migrate"] }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
tower = "0.5"
uuid = { version = "1", features = ["v7", "serde"] }
vsss-rs = "6"
x509-parser = "0.18"
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
