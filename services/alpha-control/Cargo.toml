[package]
name = "alpha-control"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Verifies platform documents under release-keys/dev.pub: the stand's control plane, never a release.
dev = ["alpha-channel/dev"]

[dependencies]
alpha-channel = { path = "../../crates/alpha-channel" }
alpha-client = { path = "../../crates/alpha-client", features = ["acme"] }
alpha-core = { path = "../../crates/alpha-core" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
data-encoding = "2"
getrandom = "0.4"
parking_lot = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "uuid", "json", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
uuid = { version = "1", features = ["v7", "serde"] }
zeroize = "1"

[dev-dependencies]
alpha-channel = { path = "../../crates/alpha-channel", features = ["dev"] }
ed25519-dalek = "3"
tower = { version = "0.5", default-features = false, features = ["util"] }
