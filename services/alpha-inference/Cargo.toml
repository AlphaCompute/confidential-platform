[package]
name = "alpha-inference"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
alpha-attest = { path = "../../crates/alpha-attest" }
alpha-client = { path = "../../crates/alpha-client" }
alpha-core = { path = "../../crates/alpha-core" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
getrandom = "0.4"
hex = "0.4"
hyper-util = { version = "0.1", features = ["server", "server-auto", "server-graceful", "service", "tokio"] }
parking_lot = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "query"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
zeroize = "1"

[dev-dependencies]
chrono = { version = "0.4", default-features = false }
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
