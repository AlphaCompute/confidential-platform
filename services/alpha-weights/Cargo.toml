[package]
name = "alpha-weights"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aes-gcm = "0.11"
alpha-client = { path = "../../crates/alpha-client" }
getrandom = "0.4"
hex = "0.4"
hmac = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
zeroize = "1"
