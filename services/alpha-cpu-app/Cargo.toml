[package]
name = "alpha-cpu-app"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
alpha-client = { path = "../../crates/alpha-client" }
axum = "0.8"
base64 = "0.23"
hex = "0.4"
hmac = "0.13"
hyper-util = { version = "0.1", features = ["server", "server-auto", "service", "tokio"] }
parking_lot = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
zeroize = "1"
