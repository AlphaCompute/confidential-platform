[package]
name = "alpha-broker"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aes-gcm = "0.11"
alpha-channel = { path = "../../crates/alpha-channel" }
alpha-client = { path = "../../crates/alpha-client" }
alpha-core = { path = "../../crates/alpha-core" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
base64 = "0.23"
getrandom = "0.4"
hex = "0.4"
parking_lot = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "uuid", "chrono", "json", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v7", "serde"] }
zeroize = "1"

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
axum = { version = "0.8", default-features = false, features = ["form"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "service", "tokio"] }
p256 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
