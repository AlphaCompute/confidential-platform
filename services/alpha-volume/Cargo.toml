[package]
name = "alpha-volume"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
alpha-attest = { path = "../../crates/alpha-attest" }
alpha-channel = { path = "../../crates/alpha-channel" }
alpha-client = { path = "../../crates/alpha-client" }
alpha-core = { path = "../../crates/alpha-core" }
alpha-tsm = { path = "../../crates/alpha-tsm" }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
zeroize = "1"

[dev-dependencies]
base64 = "0.23"
