[package]
name = "alpha-guard"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
alpha-client = { path = "../../crates/alpha-client" }
alpha-core = { path = "../../crates/alpha-core" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
hex = "0.4"
parking_lot = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
zeroize = "1"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
