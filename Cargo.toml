[workspace]
resolver = "3"
members = ["crates/*", "services/*"]

[workspace.package]
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"

# ponytail: sqlx 0.9.0 plus two patches. launchbadge/sqlx#3879 (sslnegotiation=direct): a Phala CVM
# is reachable only through the dstack gateway, which routes by the SNI of the first bytes, so the
# KMS must open its Postgres connection with a TLS ClientHello rather than an SSLRequest. libpq's
# channel_binding and require_auth (SCRAM-SHA-256-PLUS with tls-server-end-point, everything else
# refused): a Kata node's Postgres connection crosses the host's network under sslmode=require, so
# only channel binding keeps the host from learning the password or relaying the login. Drop this
# section for the first sqlx release that has both options.
[patch.crates-io]
sqlx = { git = "https://github.com/AlphaCompute/sqlx", rev = "1bb86958580b5676f223f168da76a135ceef900f" }
sqlx-core = { git = "https://github.com/AlphaCompute/sqlx", rev = "1bb86958580b5676f223f168da76a135ceef900f" }
sqlx-macros = { git = "https://github.com/AlphaCompute/sqlx", rev = "1bb86958580b5676f223f168da76a135ceef900f" }
sqlx-macros-core = { git = "https://github.com/AlphaCompute/sqlx", rev = "1bb86958580b5676f223f168da76a135ceef900f" }
sqlx-mysql = { git = "https://github.com/AlphaCompute/sqlx", rev = "1bb86958580b5676f223f168da76a135ceef900f" }
sqlx-postgres = { git = "https://github.com/AlphaCompute/sqlx", rev = "1bb86958580b5676f223f168da76a135ceef900f" }
sqlx-sqlite = { git = "https://github.com/AlphaCompute/sqlx", rev = "1bb86958580b5676f223f168da76a135ceef900f" }

# scrypt at log_n = 15 takes seconds unoptimized; the key-file tests derive six keys.
[profile.dev.package.scrypt]
opt-level = 3
