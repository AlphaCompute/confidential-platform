name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        replica: [a, b]
        image:
          - {name: alpha-runtime, dockerfile: images/manager/Dockerfile, features: ""}
          - {name: alpha-kms, dockerfile: images/kms/Dockerfile, features: ""}
          - {name: alpha-kms-dev, dockerfile: images/kms/Dockerfile, features: dev-root}
          - {name: alpha-inference, dockerfile: images/inference/Dockerfile, features: ""}
          - {name: alpha-broker, dockerfile: images/broker/Dockerfile, features: ""}
          - {name: alpha-guard, dockerfile: images/guard/Dockerfile, features: ""}
          - {name: alpha-cpu-app, dockerfile: images/cpu-app/Dockerfile, features: ""}
    env:
      IMAGE_NAME: ${{ matrix.image.name }}
      DOCKERFILE: ${{ matrix.image.dockerfile }}
      FEATURES: ${{ matrix.image.features }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build independently on this runner and retain materials
        run: |
          set -euo pipefail
          mkdir candidate
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          docker build --no-cache --platform linux/amd64 --provenance=false \
            --build-arg SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
            ${FEATURES:+--build-arg FEATURES=$FEATURES} \
            -f "$DOCKERFILE" -t "$IMAGE_NAME:candidate" .
          docker image inspect --format '{{.Id}} {{.RootFS.Layers}}' "$IMAGE_NAME:candidate" > candidate/fingerprint.txt
          docker image inspect "$IMAGE_NAME:candidate" > candidate/image-inspect.json
          docker save "$IMAGE_NAME:candidate" > candidate/image.tar
          git rev-parse HEAD > candidate/source-commit.txt
          sha256sum Cargo.lock rust-toolchain.toml "$DOCKERFILE" > candidate/materials.sha256
          cp Cargo.lock candidate/
          cargo metadata --locked --format-version 1 > candidate/cargo-dependencies.json
          docker version > candidate/builder.txt
      - name: Attest candidate archive provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: candidate/image.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.image.name }}-${{ matrix.replica }}
          path: candidate/
          if-no-files-found: error
          retention-days: 30

  # Per image, so one image's failed build (a production KMS without its release keys) does not
  # hold back the others; a missing candidate fails the comparison.
  publish:
    needs: [checks, build]
    if: ${{ !cancelled() && needs.checks.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: alpha-runtime
          # The KMS App: two CVMs, one Revision; the compose rendered below is that Revision.
          - name: alpha-kms
            app_id: 01a09f07-8d09-7640-94c1-bbdb74200a1e
          # The dev KMS App with the root KEK from env; a distinct image, never a switch.
          - name: alpha-kms-dev
            features: dev-root
            app_id: 01a09f07-8d09-7aff-b257-83dbd9e6e641
          # No app_id: the release workflow renders a compose only for the KMS.
          - name: alpha-inference
          - name: alpha-broker
          - name: alpha-guard
          - name: alpha-cpu-app
    env:
      IMAGE_NAME: ${{ matrix.name }}
      FEATURES: ${{ matrix.features }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ${{ matrix.name }}-[ab]
          path: candidates
      - name: Require identical image configurations and layers from separate runners
        run: |
          set -euo pipefail
          for f in fingerprint.txt source-commit.txt materials.sha256; do
            cmp "candidates/$IMAGE_NAME-a/$f" "candidates/$IMAGE_NAME-b/$f"
          done
          echo "$IMAGE_NAME image: $(cat "candidates/$IMAGE_NAME-a/fingerprint.txt")" >> "$GITHUB_STEP_SUMMARY"
      - name: Push
        id: push
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          docker load -i "candidates/$IMAGE_NAME-a/image.tar"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/$IMAGE_NAME:${GITHUB_REF_NAME}"
          docker tag "$IMAGE_NAME:candidate" "$image"
          docker push "$image"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")
          echo "pushed $digest" >> "$GITHUB_STEP_SUMMARY"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # The unsigned release manifest: the compose of the KMS node with this image, in the bytes
      # Phala measures, and its compose_hash for the release-key holder to sign into kms_revisions.
      - name: Render the KMS compose from the pushed digest
        if: matrix.app_id && startsWith(github.ref, 'refs/tags/')
        run: |
          {
            echo '```json'
            cargo run -q -p alpha-cli --example kms_compose -- ${FEATURES:+--dev-root} \
              "${{ matrix.app_id }}" "${{ steps.push.outputs.digest }}" "release/${{ matrix.name }}"
            echo '```'
            echo '```json'
            cat "release/${{ matrix.name }}/app-compose.json"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # The Kata node's Revision: the committed StatefulSet with this image, rendered into the
      # StatefulSet and init-data the release-key holders review and sign into kms_revisions. The
      # three URLs are measured, so they are repository variables, not secrets; no render until
      # they are set.
      - name: Render the KMS node's Kata pod from the pushed digest
        if: matrix.name == 'alpha-kms' && vars.KMS_KATA_ENDPOINTS && startsWith(github.ref, 'refs/tags/')
        env:
          APP_ID: ${{ matrix.app_id }}
          KMS_IMAGE: ${{ steps.push.outputs.digest }}
          KMS_ENDPOINTS: ${{ vars.KMS_KATA_ENDPOINTS }}
          PLATFORM_DOCUMENT_URL: ${{ vars.KMS_KATA_PLATFORM_DOCUMENT_URL }}
          PCCS_URL: ${{ vars.KMS_KATA_PCCS_URL }}
          OUT: release/${{ matrix.name }}/kata
        run: |
          url='https://[^][:space:],"'\''\\$`]+'
          [[ $KMS_ENDPOINTS =~ ^$url(,$url)*$ ]] || { echo "KMS_KATA_ENDPOINTS: not a comma-separated list of https URLs" >&2; exit 1; }
          for v in PLATFORM_DOCUMENT_URL PCCS_URL; do
            [[ ${!v} =~ ^$url$ ]] || { echo "KMS_KATA_$v: not one https URL" >&2; exit 1; }
          done
          kata="$RUNNER_TEMP/kata-tools"
          mkdir -p "$kata" "$OUT"
          # coco render checks genpolicy, its rules and settings against their release digests.
          curl -fsSL https://github.com/kata-containers/kata-containers/releases/download/4.0.0/kata-tools-static-4.0.0-amd64.tar.zst \
            | tar --zstd -x -C "$kata"
          # shellcheck disable=SC2016
          envsubst '$KMS_IMAGE $KMS_ENDPOINTS $PLATFORM_DOCUMENT_URL $PCCS_URL' < deploy/kata/kms-node.yaml > "$RUNNER_TEMP/kms-node.yaml"
          cargo run -q -p alpha-cli --bin alpha -- coco render --app-id "$APP_ID" --kata "$kata/opt/kata" \
            --out "$OUT/kms-node.yaml" "$RUNNER_TEMP/kms-node.yaml" > "$RUNNER_TEMP/rendered.json"
          jq -j .init_data "$RUNNER_TEMP/rendered.json" > "$OUT/init-data.toml"
          jq --arg image "$KMS_IMAGE" '{image: $image, compose_hash: .revision, rules_sha256, policy_data_sha256}' \
            "$RUNNER_TEMP/rendered.json" > "$OUT/manifest.json"
          if [ "$(jq -r .compose_hash "$OUT/manifest.json")" != "sha256:$(sha256sum < "$OUT/init-data.toml" | cut -d' ' -f1)" ]; then
            echo "the rendered Revision is not the SHA-256 of init-data.toml" >&2
            exit 1
          fi
          {
            echo '```json'
            cat "$OUT/manifest.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.app_id && startsWith(github.ref, 'refs/tags/')
        with:
          name: ${{ matrix.name }}-release-manifest
          path: release/${{ matrix.name }}
          if-no-files-found: error
