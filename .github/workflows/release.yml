name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runner: [a, b]
        image:
          - {name: alpha-runtime, dockerfile: images/manager/Dockerfile}
          - {name: alpha-kms, dockerfile: images/kms/Dockerfile}
          - {name: alpha-kms-dev, dockerfile: images/kms/Dockerfile, features: dev-root}
          - {name: alpha-inference, dockerfile: images/inference/Dockerfile}
          - {name: alpha-broker, dockerfile: images/broker/Dockerfile}
          - {name: alpha-guard, dockerfile: images/guard/Dockerfile}
          - {name: alpha-cpu-app, dockerfile: images/cpu-app/Dockerfile}
    env:
      NAME: ${{ matrix.image.name }}
      DOCKERFILE: ${{ matrix.image.dockerfile }}
      FEATURES: ${{ matrix.image.features }}
      RUNNER_LABEL: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build ${{ matrix.image.name }} from nothing
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          docker build --no-cache --platform linux/amd64 --provenance=false \
            --build-arg SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
            ${FEATURES:+--build-arg FEATURES=$FEATURES} \
            -f "$DOCKERFILE" -t "$NAME:candidate" .
          mkdir out
          docker image inspect --format '{{.Id}} {{.RootFS.Layers}}' "$NAME:candidate" > out/fingerprint
          # The other runner's image only has to match; this one is the image that is pushed.
          if [ "$RUNNER_LABEL" = a ]; then docker save "$NAME:candidate" | gzip > out/image.tar.gz; fi
          echo "$NAME on runner $RUNNER_LABEL (Docker $(docker version --format '{{.Server.Version}}'), SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH): $(cat out/fingerprint)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.image.name }}-${{ matrix.runner }}
          path: out
          if-no-files-found: error
          retention-days: 7

  # Per image and after every build, so one image's failed build (a production KMS before the
  # release keys exist) holds back only that image; its missing build fails the comparison.
  image:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: alpha-runtime
          # The KMS App: two CVMs, one Revision; the compose rendered below is that Revision.
          - name: alpha-kms
            app_id: 01a09f07-8d09-7640-94c1-bbdb74200a1e
          # The dev KMS App with the root KEK from env; a distinct image, never a switch.
          - name: alpha-kms-dev
            features: dev-root
            app_id: 01a09f07-8d09-7aff-b257-83dbd9e6e641
          # No app_id: the release workflow renders a compose only for the KMS.
          - name: alpha-inference
          - name: alpha-broker
          - name: alpha-guard
          - name: alpha-cpu-app
    env:
      NAME: ${{ matrix.name }}
      FEATURES: ${{ matrix.features }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ matrix.name }}-[ab]
          path: builds
      - name: Require one image from both runners
        run: |
          if ! cmp "builds/$NAME-a/fingerprint" "builds/$NAME-b/fingerprint"; then
            echo "the two runners' builds of $NAME differ; the image is not reproducible" >&2
            exit 1
          fi
          gunzip -c "builds/$NAME-a/image.tar.gz" | docker load
          if [ "$(docker image inspect --format '{{.Id}} {{.RootFS.Layers}}' "$NAME:candidate")" != "$(cat "builds/$NAME-a/fingerprint")" ]; then
            echo "the archived $NAME is not the image runner a built" >&2
            exit 1
          fi
      - name: Push
        id: push
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          repository="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/$NAME"
          docker tag "$NAME:candidate" "$repository:$GITHUB_REF_NAME"
          docker push "$repository:$GITHUB_REF_NAME"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$repository:$GITHUB_REF_NAME")
          echo "pushed $digest" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "digest=$digest"
            echo "repository=$repository"
            echo "sha256=${digest#*@}"
          } >> "$GITHUB_OUTPUT"
      - name: Attest the pushed image's build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.repository }}
          subject-digest: ${{ steps.push.outputs.sha256 }}
          push-to-registry: true
      # The unsigned release manifest: the compose of the KMS node with this image, in the bytes
      # Phala measures, and its compose_hash for the release-key holder to sign into kms_revisions.
      - name: Render the KMS compose from the pushed digest
        if: matrix.app_id && startsWith(github.ref, 'refs/tags/')
        run: |
          {
            echo '```json'
            cargo run -q -p alpha-cli --example kms_compose -- ${FEATURES:+--dev-root} \
              "${{ matrix.app_id }}" "${{ steps.push.outputs.digest }}" "release/${{ matrix.name }}"
            echo '```'
            echo '```json'
            cat "release/${{ matrix.name }}/app-compose.json"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # The Kata node's Revision: the committed StatefulSet with this image, rendered into the
      # StatefulSet and init-data the release-key holders review and sign into kms_revisions. The
      # three URLs are measured, so they are repository variables, not secrets; no render until
      # they are set.
      - name: Render the KMS node's Kata pod from the pushed digest
        if: matrix.name == 'alpha-kms' && vars.KMS_KATA_ENDPOINTS && startsWith(github.ref, 'refs/tags/')
        env:
          APP_ID: ${{ matrix.app_id }}
          KMS_IMAGE: ${{ steps.push.outputs.digest }}
          KMS_ENDPOINTS: ${{ vars.KMS_KATA_ENDPOINTS }}
          PLATFORM_DOCUMENT_URL: ${{ vars.KMS_KATA_PLATFORM_DOCUMENT_URL }}
          PCCS_URL: ${{ vars.KMS_KATA_PCCS_URL }}
          OUT: release/${{ matrix.name }}/kata
        run: |
          url='https://[^][:space:],"'\''\\$`]+'
          [[ $KMS_ENDPOINTS =~ ^$url(,$url)*$ ]] || { echo "KMS_KATA_ENDPOINTS: not a comma-separated list of https URLs" >&2; exit 1; }
          for v in PLATFORM_DOCUMENT_URL PCCS_URL; do
            [[ ${!v} =~ ^$url$ ]] || { echo "KMS_KATA_$v: not one https URL" >&2; exit 1; }
          done
          kata="$RUNNER_TEMP/kata-tools"
          mkdir -p "$kata" "$OUT"
          # coco render checks genpolicy, its rules and settings against their release digests.
          curl -fsSL https://github.com/kata-containers/kata-containers/releases/download/4.0.0/kata-tools-static-4.0.0-amd64.tar.zst \
            | tar --zstd -x -C "$kata"
          # shellcheck disable=SC2016
          envsubst '$KMS_IMAGE $KMS_ENDPOINTS $PLATFORM_DOCUMENT_URL $PCCS_URL' < deploy/kata/kms-node.yaml > "$RUNNER_TEMP/kms-node.yaml"
          cargo run -q -p alpha-cli --bin alpha -- coco render --app-id "$APP_ID" --kata "$kata/opt/kata" \
            --out "$OUT/kms-node.yaml" "$RUNNER_TEMP/kms-node.yaml" > "$RUNNER_TEMP/rendered.json"
          jq -j .init_data "$RUNNER_TEMP/rendered.json" > "$OUT/init-data.toml"
          jq --arg image "$KMS_IMAGE" '{image: $image, compose_hash: .revision, rules_sha256, policy_data_sha256}' \
            "$RUNNER_TEMP/rendered.json" > "$OUT/manifest.json"
          if [ "$(jq -r .compose_hash "$OUT/manifest.json")" != "sha256:$(sha256sum < "$OUT/init-data.toml" | cut -d' ' -f1)" ]; then
            echo "the rendered Revision is not the SHA-256 of init-data.toml" >&2
            exit 1
          fi
          {
            echo '```json'
            cat "$OUT/manifest.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.app_id && startsWith(github.ref, 'refs/tags/')
        with:
          name: ${{ matrix.name }}-release-manifest
          path: release/${{ matrix.name }}
          if-no-files-found: error
