name: release-candidates

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        replica: [a, b]
        image:
          - {name: alpha-runtime, dockerfile: images/manager/Dockerfile, features: ""}
          - {name: alpha-kms, dockerfile: images/kms/Dockerfile, features: ""}
          - {name: alpha-kms-dev, dockerfile: images/kms/Dockerfile, features: dev-root}
          - {name: alpha-cpu-app, dockerfile: images/cpu-app/Dockerfile, features: ""}
    env:
      IMAGE_NAME: ${{ matrix.image.name }}
      DOCKERFILE: ${{ matrix.image.dockerfile }}
      FEATURES: ${{ matrix.image.features }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build independently on this runner and retain materials
        run: |
          set -euo pipefail
          mkdir candidate
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          docker build --no-cache --platform linux/amd64 --provenance=false \
            --build-arg SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
            ${FEATURES:+--build-arg FEATURES=$FEATURES} \
            -f "$DOCKERFILE" -t "$IMAGE_NAME:candidate" .
          docker image inspect --format '{{.Id}} {{.RootFS.Layers}}' "$IMAGE_NAME:candidate" > candidate/fingerprint.txt
          docker image inspect "$IMAGE_NAME:candidate" > candidate/image-inspect.json
          docker save "$IMAGE_NAME:candidate" > candidate/image.tar
          git rev-parse HEAD > candidate/source-commit.txt
          sha256sum Cargo.lock rust-toolchain.toml "$DOCKERFILE" > candidate/materials.sha256
          cp Cargo.lock candidate/
          cargo metadata --locked --format-version 1 > candidate/cargo-dependencies.json
          docker version > candidate/builder.txt
          printf 'Unqualified candidate: complete OS/native SBOM and acceptance are required before publication.\n' > candidate/STATUS.txt
      - name: Attest candidate archive provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: candidate/image.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.image.name }}-${{ matrix.replica }}
          path: candidate/
          if-no-files-found: error
          retention-days: 30

  compare:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: candidates
      - name: Require identical image configurations and layers from separate runners
        run: |
          set -euo pipefail
          for name in alpha-runtime alpha-kms alpha-kms-dev alpha-cpu-app; do
            cmp "candidates/$name-a/fingerprint.txt" "candidates/$name-b/fingerprint.txt"
            cmp "candidates/$name-a/source-commit.txt" "candidates/$name-b/source-commit.txt"
            cmp "candidates/$name-a/materials.sha256" "candidates/$name-b/materials.sha256"
            printf '%s: independent fingerprints match; publication remains gated.\n' "$name" >> "$GITHUB_STEP_SUMMARY"
          done
      # Intentionally no registry push. A separately authorized publisher must
      # verify candidate attestations, SBOM, customer approvals and acceptance.
