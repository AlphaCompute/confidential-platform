name: stand

# The control plane lists a copy as running whatever its containers do, so a service that has
# stopped is seen only by asking. This asks every fifteen minutes and fails when a copy of one
# of the stand's Apps is not serving, which is what makes GitHub send a notification.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  serving:
    runs-on: ubuntu-latest
    steps:
      - env:
          SHROUD_URL: ${{ vars.STAND_SHROUD_URL }}
          APPS: ${{ vars.STAND_APPS }}
          KEY: ${{ secrets.STAND_LIST_KEY }}
        run: |
          # $1 prefixes each finding: only the last attempt's are errors.
          check() {
            down=0
            for app in $APPS; do
              if ! list=$(printf 'header = "Authorization: Bearer %s"\n' "$KEY" |
                curl -sS -f -m 30 -K - "$SHROUD_URL/v1/apps/$app/instances"); then
                echo "$1$app: the list did not answer"
                down=1
              elif ! echo "$list" | jq -e '.instances | length > 0 and all(.serving == true)' >/dev/null; then
                echo "$1$app: $(echo "$list" | jq -c '[.instances[] | {id, state, serving}]')"
                down=1
              fi
            done
            return $down
          }
          set -- $APPS
          [ $# -gt 0 ] || { echo "::error::STAND_APPS names no App"; exit 1; }
          # A copy does not serve for a minute while it is being redeployed.
          check "" || { sleep 120; check "::error::"; }

  # Each owned KMS node and App Endpoint, verified as a relying party on the internet would.
  #   STAND_PLATFORM_DOCUMENT_URL  the stand's platform document; unset skips this job
  #   STAND_KMS_ENDPOINTS          the KMS nodes, whitespace-separated https URLs
  #   STAND_APP_ENDPOINTS          one `<app id> <url>` per line
  #   STAND_PCCS_URL               the PCCS the KMS fetches collateral from; unset skips it
  owned:
    if: vars.STAND_PLATFORM_DOCUMENT_URL != ''
    runs-on: ubuntu-latest
    # Under the fifteen-minute schedule, so a slow round never overlaps the next.
    timeout-minutes: 14
    concurrency:
      group: stand-owned
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The stand's document is signed by the dev release key; `prod.pub` stays a placeholder
      # until the key ceremony, and a production build refuses it.
      - run: cargo build --locked --release -p alpha-cli --features dev
      - env:
          ALPHACOMPUTE_PLATFORM_DOCUMENT_URL: ${{ vars.STAND_PLATFORM_DOCUMENT_URL }}
          KMS: ${{ vars.STAND_KMS_ENDPOINTS }}
          APPS: ${{ vars.STAND_APP_ENDPOINTS }}
          PCCS: ${{ vars.STAND_PCCS_URL }}
        run: |
          alpha=target/release/alpha
          # $1 prefixes each finding: only the last attempt's are errors.
          check() {
            down=0
            # Appraisal needs the TDX QE identity, and unlike the TCB info it is not per platform.
            if [ -n "$PCCS" ]; then
              out=$(curl -sS -f -m 30 "${PCCS%/}/tdx/certification/v4/qe/identity" 2>&1) && [ -n "$out" ] ||
                { echo "$1$PCCS: no TDX QE identity: ${out:-empty body}"; down=1; }
            fi
            for url in $KMS; do
              out=$($alpha verify --kms-node "$url" 2>&1) || { echo "$1$url: $out"; down=1; }
            done
            while read -r app url; do
              [ -n "$app" ] || continue
              out=$($alpha verify --app "$app" "$url" 2>&1) || { echo "$1$app $url: $out"; down=1; }
            done <<< "$APPS"
            return $down
          }
          [ -n "${KMS//[[:space:]]/}${APPS//[[:space:]]/}" ] || { echo "::error::STAND_KMS_ENDPOINTS and STAND_APP_ENDPOINTS name nothing"; exit 1; }
          check "" || { sleep 120; check "::error::"; }
