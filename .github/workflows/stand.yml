name: stand

# Every fifteen minutes each job asks whether what it watches is serving and fails when something
# is not, which is what makes GitHub send a notification. The checks are .github/stand/check.sh;
# a failing round is retried once after two minutes and only the second round's findings are
# errors.
#
# STAND_TARGET says what is watched: unset (or `prototype`) until M-D, `both` while the owned
# platform runs beside the prototype, `owned` once the prototype is retired. Every variable a
# watched part needs must then be set; an empty or whitespace-only one fails the run.
#
# prototype, until M-D, from a GitHub-hosted runner (unchanged from before PRD-01):
#   STAND_SHROUD_URL              the prototype's shroud-go
#   STAND_APPS                    the Apps whose copies must all be serving
#   secret STAND_LIST_KEY         API key that may list the Apps' copies
# owned, from M-D, from a GitHub-hosted runner, as a client on the internet reaches the platform.
# Each probe is the alpha CLI's own pinned TLS: the chain must end at the KMS CA of the
# release-signed platform document and the leaf must name an allowed Revision; the host name is
# only routing, since KMS-issued leaves carry URI SANs and no DNS name.
#   STAND_PLATFORM_DOCUMENT_URL   the release-signed platform document: its KMS CA and node
#                                 Revisions are the pins
#   STAND_KMS_ENDPOINTS           the KMS nodes of both failure domains, https:// URLs,
#                                 whitespace-separated; each must answer /ready unsealed
#   STAND_APP_ENDPOINTS           the platform services' public Endpoints (broker, front, signer,
#                                 shroud-go, ...), whitespace-separated, each
#                                 <url>=<revision>[,<revision>...]: list a deploy's next Revision
#                                 before it starts and drop the old one after
# site, from M-D, from a self-hosted runner at the site, the only place the PCCS answers:
#   STAND_SITE_RUNNER             the runner's label. The repository is public, so the runner's
#                                 group must admit only this workflow on main
#   STAND_PCCS_URL                the site PCCS, https://pccs.<site>:8081
#   STAND_SITE_CA_PEM             the site CA the PCCS certificate chains to
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  prototype:
    if: vars.STAND_TARGET != 'owned'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - env:
          STAND_TARGET: ${{ vars.STAND_TARGET }}
          STAND_SHROUD_URL: ${{ vars.STAND_SHROUD_URL }}
          STAND_APPS: ${{ vars.STAND_APPS }}
          STAND_LIST_KEY: ${{ secrets.STAND_LIST_KEY }}
        run: bash .github/stand/check.sh prototype

  owned:
    if: vars.STAND_TARGET == 'owned' || vars.STAND_TARGET == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # The probe is built only when the crates change; a failed probe must not lose the build.
      - id: alpha
        uses: actions/cache/restore@v4
        with:
          path: stand-bin
          key: stand-alpha-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'crates/**') }}
      - if: steps.alpha.outputs.cache-hit != 'true'
        run: |
          cargo build --release --locked -p alpha-cli
          mkdir -p stand-bin
          cp target/release/alpha stand-bin/alpha
      - if: steps.alpha.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: stand-bin
          key: ${{ steps.alpha.outputs.cache-primary-key }}
      - env:
          STAND_TARGET: ${{ vars.STAND_TARGET }}
          STAND_ALPHA: stand-bin/alpha
          STAND_PLATFORM_DOCUMENT_URL: ${{ vars.STAND_PLATFORM_DOCUMENT_URL }}
          STAND_KMS_ENDPOINTS: ${{ vars.STAND_KMS_ENDPOINTS }}
          STAND_APP_ENDPOINTS: ${{ vars.STAND_APP_ENDPOINTS }}
        run: bash .github/stand/check.sh owned

  site:
    if: vars.STAND_TARGET == 'owned' || vars.STAND_TARGET == 'both'
    # Without the label this runs on a hosted runner only to fail and name the missing variable.
    runs-on: ${{ vars.STAND_SITE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - env:
          STAND_TARGET: ${{ vars.STAND_TARGET }}
          STAND_SITE_RUNNER: ${{ vars.STAND_SITE_RUNNER }}
          STAND_PCCS_URL: ${{ vars.STAND_PCCS_URL }}
          STAND_SITE_CA_PEM: ${{ vars.STAND_SITE_CA_PEM }}
        run: bash .github/stand/check.sh site
