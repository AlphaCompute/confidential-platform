name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Other repositories copy these vectors and check their copy with this same pipeline, not
      # `sha256sum -c`, which fails on an empty manifest and misses a vector nobody listed. To
      # update the manifest, run the pipeline with `> SHA256SUMS` in place of the diff.
      - working-directory: testdata
        shell: bash
        run: find . -type f \( -path './webauthn/*' -o -path './receipt/*' -o -path './catalog/*' -o -path './jcs/*' \) -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum | sed 's|  \./|  |' | diff - SHA256SUMS
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p alpha-channel --target wasm32-unknown-unknown --all-targets -- -D warnings
      - run: cargo test --workspace
      # genpolicy accepts the KMS StatefulSet, writes the policy for its pods' names, and the
      # policy's data is the one the platform document pins. The image only shapes the container
      # entries, which the pin leaves out, so any public one renders; ghcr.io, as public.ecr.aws
      # rate-limits anonymous pulls from runners.
      - name: Render the KMS StatefulSet with the release genpolicy
        shell: bash
        env:
          KMS_IMAGE: ghcr.io/alphacompute/alpha-runtime@sha256:bb7dca63cfd0c44b50e87cc844a3c9eec001c8ded52f404fd476af97ec22dbe7
          KMS_ENDPOINTS: https://kms-0.kms.alpha-kms.svc:8443,https://kms-1.kms.alpha-kms.svc:8443
          PLATFORM_DOCUMENT_URL: https://platform.invalid/document.json
          PCCS_URL: https://pccs.invalid
        run: |
          kata="$RUNNER_TEMP/kata-tools"
          mkdir -p "$kata"
          curl -fsSL https://github.com/kata-containers/kata-containers/releases/download/4.0.0/kata-tools-static-4.0.0-amd64.tar.zst \
            | tar --zstd -x -C "$kata"
          # shellcheck disable=SC2016
          envsubst '$KMS_IMAGE $KMS_ENDPOINTS $PLATFORM_DOCUMENT_URL $PCCS_URL' < deploy/kata/kms-node.yaml > "$RUNNER_TEMP/kms-node.yaml"
          target/debug/alpha coco render --app-id 01a09f07-8d09-7640-94c1-bbdb74200a1e --kata "$kata/opt/kata" \
            --out "$RUNNER_TEMP/out.yaml" "$RUNNER_TEMP/kms-node.yaml" > "$RUNNER_TEMP/rendered.json"
          jq -e --slurpfile pinned testdata/coco/expected.json \
            '.policy_data_sha256 == $pinned[0].policy_data_sha256' "$RUNNER_TEMP/rendered.json"
          jq -r .init_data "$RUNNER_TEMP/rendered.json" | grep -qF '"io.kubernetes.cri.sandbox-name": "^kms-[0-9]+$"'
      # The same CLI version build-web.sh requires, so the tests run the glue a page loads.
      - run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - run: cargo test -p alpha-channel --target wasm32-unknown-unknown
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner

  signer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The tests load the dev stand's platform document; the production key set is the ceremony's.
    env:
      FEATURES: dev
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - shell: bash
        run: web/signer/build.sh web/signer/dist | tee -a "$GITHUB_STEP_SUMMARY"
      # An empty target directory is what a stranger rebuilding the commit starts from.
      - run: CARGO_TARGET_DIR="$RUNNER_TEMP/empty-target" web/signer/build.sh "$RUNNER_TEMP/dist2"
      - run: diff -r web/signer/dist "$RUNNER_TEMP/dist2"
      - run: SIGNER_DIST=web/signer/dist node --test web/signer/test/*.test.js
      - run: web/signer/test/smoke.sh web/signer/dist
      - uses: actions/upload-artifact@v4
        with:
          name: signer-bundle
          path: web/signer/dist/

  db-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: alpha
          POSTGRES_PASSWORD: alpha
          POSTGRES_DB: alpha
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U alpha"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://alpha:alpha@localhost:5432/alpha
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: sqlx offline data is current
        run: |
          if [ -d services ]; then
            cargo install sqlx-cli --no-default-features --features postgres,rustls --locked
            cargo sqlx migrate run --source services/alpha-kms/migrations
            cargo sqlx prepare --workspace --check -- --all-targets
          else
            echo "no service crate yet; skipping"
          fi
      - run: cargo test --workspace
