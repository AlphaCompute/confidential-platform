name: ci

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  provisioning-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 -m pip install ./integrations/dstack-tee
      - run: python3 -m unittest discover -s integrations/dstack-tee/tests -v
      - run: python3 -m unittest discover -s deploy/tests -v

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  db-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: alpha
          POSTGRES_PASSWORD: alpha
          POSTGRES_DB: alpha
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U alpha"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://alpha:alpha@localhost:5432/alpha
      ALPHA_REQUIRE_DATABASE_TESTS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: sqlx offline data is current
        run: |
          cargo install sqlx-cli --git https://github.com/AlphaCompute/sqlx --rev cbfd2eee5b84c5f8549dd2810ec31df441255659 --no-default-features --features postgres,rustls --locked
          cargo sqlx migrate run --source services/alpha-kms/migrations
          cargo sqlx prepare --workspace --check -- --all-targets
      - run: cargo test --workspace
