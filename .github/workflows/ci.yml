name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  db-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: alpha
          POSTGRES_PASSWORD: alpha
          POSTGRES_DB: alpha
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U alpha"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://alpha:alpha@localhost:5432/alpha
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: sqlx offline data is current
        run: |
          if [ -d services ]; then
            cargo install sqlx-cli --no-default-features --features postgres,rustls --locked
            cargo sqlx prepare --workspace --check -- --all-targets
          else
            echo "no service crate yet; skipping"
          fi
      - run: cargo test --workspace
