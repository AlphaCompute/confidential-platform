name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Other repositories copy these vectors and check their copy with this same pipeline, not
      # `sha256sum -c`, which fails on an empty manifest and misses a vector nobody listed. To
      # update the manifest, run the pipeline with `> SHA256SUMS` in place of the diff.
      - working-directory: testdata
        shell: bash
        run: find . -type f \( -path './webauthn/*' -o -path './receipt/*' -o -path './catalog/*' -o -path './jcs/*' \) -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum | sed 's|  \./|  |' | diff - SHA256SUMS
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p alpha-channel --target wasm32-unknown-unknown --all-targets -- -D warnings
      - run: cargo test --workspace
      # The same CLI version build-web.sh requires, so the tests run the glue a page loads.
      - run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - run: cargo test -p alpha-channel --target wasm32-unknown-unknown
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner

  signer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: web/signer/build.sh web/signer/dist
      # An empty target directory is what a stranger rebuilding the commit starts from.
      - run: CARGO_TARGET_DIR="$RUNNER_TEMP/empty-target" web/signer/build.sh "$RUNNER_TEMP/dist2"
      - run: diff -r web/signer/dist "$RUNNER_TEMP/dist2"
      - run: SIGNER_DIST=web/signer/dist node --test web/signer/test/*.test.js
      - run: web/signer/test/smoke.sh web/signer/dist
      - run: echo "bundle_sha256 sha256:$(sha256sum web/signer/dist/index.html | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: signer-bundle
          path: web/signer/dist/

  db-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: alpha
          POSTGRES_PASSWORD: alpha
          POSTGRES_DB: alpha
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U alpha"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://alpha:alpha@localhost:5432/alpha
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: sqlx offline data is current
        run: |
          if [ -d services ]; then
            cargo install sqlx-cli --no-default-features --features postgres,rustls --locked
            cargo sqlx migrate run --source services/alpha-kms/migrations
            cargo sqlx prepare --workspace --check -- --all-targets
          else
            echo "no service crate yet; skipping"
          fi
      - run: cargo test --workspace
