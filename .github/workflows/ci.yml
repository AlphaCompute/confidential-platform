name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Other repositories copy these vectors and check their copy with this same pipeline, not
      # `sha256sum -c`, which fails on an empty manifest and misses a vector nobody listed. To
      # update the manifest, run the pipeline with `> SHA256SUMS` in place of the diff.
      - working-directory: testdata
        shell: bash
        run: find . -type f \( -path './webauthn/*' -o -path './receipt/*' -o -path './catalog/*' -o -path './jcs/*' \) -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum | sed 's|  \./|  |' | diff - SHA256SUMS
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p alpha-channel --target wasm32-unknown-unknown --all-targets -- -D warnings
      - run: cargo test --workspace
      # The same CLI version build-web.sh requires, so the tests run the glue a page loads.
      - run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - run: cargo test -p alpha-channel --target wasm32-unknown-unknown
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner

  signer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - shell: bash
        run: web/signer/build.sh web/signer/dist | tee -a "$GITHUB_STEP_SUMMARY"
      # An empty target directory is what a stranger rebuilding the commit starts from.
      - run: CARGO_TARGET_DIR="$RUNNER_TEMP/empty-target" web/signer/build.sh "$RUNNER_TEMP/dist2"
      - run: diff -r web/signer/dist "$RUNNER_TEMP/dist2"
      - run: SIGNER_DIST=web/signer/dist node --test web/signer/test/*.test.js
      - run: web/signer/test/smoke.sh web/signer/dist
      - uses: actions/upload-artifact@v4
        with:
          name: signer-bundle
          path: web/signer/dist/

  db-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: alpha
          POSTGRES_PASSWORD: alpha
          POSTGRES_DB: alpha
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U alpha"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://alpha:alpha@localhost:5432/alpha
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: sqlx offline data is current
        run: |
          if [ -d services ]; then
            cargo install sqlx-cli --no-default-features --features postgres,rustls --locked
            cargo sqlx migrate run --source services/alpha-kms/migrations
            cargo sqlx prepare --workspace --check -- --all-targets
          else
            echo "no service crate yet; skipping"
          fi
      # D10: a second Postgres admitting KMS nodes by client certificate only, set up as
      # docs/db-client-auth.md says, for alpha-kms's tests/db_auth.rs and kata_node.rs (client-cert
      # join). Its key is the fixed test volume key; nothing else uses it.
      - name: cert-auth Postgres (D10)
        shell: bash
        run: |
          D="$RUNNER_TEMP/pg-cert"
          mkdir -p "$D/init"
          echo "create role alpha_kms nologin; create role alpha_kms_node login in role alpha_kms;" > "$D/init/01-role.sql"
          ALPHACOMPUTE_DB_AUTH_PG_DIR="$D" cargo test -p alpha-kms --test db_auth write_postgres_side
          docker run -d --name pg-cert -p 127.0.0.1:55433:5432 \
            -e POSTGRES_USER=alpha -e POSTGRES_PASSWORD=alpha -e POSTGRES_DB=alpha \
            -v "$D":/certs-src:ro -v "$D/init":/docker-entrypoint-initdb.d:ro --entrypoint bash postgres:18 \
            -c 'mkdir -p /certs && cp /certs-src/*.* /certs/ && chown -R postgres /certs && chmod 600 /certs/server.key && exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/certs/server.crt -c ssl_key_file=/certs/server.key -c ssl_ca_file=/certs/root.crt -c hba_file=/certs/pg_hba.conf -c ident_file=/certs/pg_ident.conf -c ssl_min_protocol_version=TLSv1.3 -c log_connections=authentication'
          # Over TCP: the entrypoint's init server listens on its socket only.
          for _ in $(seq 60); do
            docker exec -e PGPASSWORD=alpha pg-cert psql -h 127.0.0.1 -U alpha -d alpha -c 'select 1' >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec -e PGPASSWORD=alpha pg-cert psql -h 127.0.0.1 -U alpha -d alpha -c 'select 1'
          echo "ALPHACOMPUTE_DB_AUTH_URL=postgres://alpha_kms_node@localhost:55433/alpha" >> "$GITHUB_ENV"
          echo "ALPHACOMPUTE_DB_AUTH_ADMIN_URL=postgres://alpha:alpha@localhost:55433/alpha?sslmode=require" >> "$GITHUB_ENV"
      # PRD-02 deliverable 7, named so its result shows on its own; the workspace run repeats it.
      - name: malicious-host core suite
        run: cargo test -p alpha-kms --test malicious_host
      - run: cargo test --workspace
