name: pr-policy

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          EXTRA_PATHS: ${{ secrets.PR_POLICY_FORBIDDEN_PATHS }}
          EXTRA_TERMS: ${{ secrets.PR_POLICY_FORBIDDEN_TERMS }}
        run: |
          fail=0
          for re in "$EXTRA_PATHS" "$EXTRA_TERMS"; do
            rc=0; grep -E "$re" </dev/null || rc=$?
            if [ "$rc" -gt 1 ]; then echo "::error::A PR_POLICY_FORBIDDEN_* variable is not a valid regex."; fail=1; fi
          done
          if [ "$BASE_REF" != main ]; then
            echo "::error::Open the pull request against main, not $BASE_REF."
            fail=1
          fi

          added=$(git diff --numstat "$BASE_SHA...$HEAD_SHA" -- ':!Cargo.lock' ':(exclude,glob)**/.sqlx/**' ':(exclude,glob)**/testdata/**' \
            | awk '$1 != "-" { n += $1 } END { print n + 0 }')
          if [ "$added" -gt 1000 ]; then
            echo "::error::$added added lines; split the change into pull requests of at most 1000."
            fail=1
          fi

          if [ -n "$EXTRA_PATHS" ] && git log -m --name-only --format= "$BASE_SHA..$HEAD_SHA" | grep -E "$EXTRA_PATHS" >/dev/null; then
            echo "::error::The diff contains files that must stay local."
            fail=1
          fi

          for c in $(git rev-list "$BASE_SHA..$HEAD_SHA" -- CLAUDE.md); do
            mode=$(git ls-tree "$c" CLAUDE.md | cut -d' ' -f1)
            if [ "$mode" != 120000 ] || [ "$(git cat-file -p "$c:CLAUDE.md")" != AGENTS.md ]; then
              echo "::error::CLAUDE.md must stay a symlink to AGENTS.md (commit $c)."
              fail=1
            fi
          done

          cc='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [^ ]'
          bad=$( (printf '%s\n' "$TITLE"; git log --no-merges --format=%s "$BASE_SHA..$HEAD_SHA") | grep -vE "$cc" || true)
          if [ -n "$bad" ]; then
            echo "::error::Not a Conventional Commits subject (type(scope): description):"
            printf '%s\n' "$bad"
            fail=1
          fi

          ids='\b(PRD|ADR)[- ]?[0-9]+|\b[DIMP][0-9]{1,2}\b'
          [ -n "$EXTRA_TERMS" ] && ids="$ids|$EXTRA_TERMS"
          words='\b(phase|plan|milestone|deliverable) [0-9]|generated with'
          text=$(printf '%s\n%s\n' "$TITLE" "$BODY"; git log --format=%B "$BASE_SHA..$HEAD_SHA")
          hits=$(printf '%s\n' "$text" | grep -E "$ids"; printf '%s\n' "$text" | grep -iE "$words" || true)
          if [ -n "$hits" ]; then
            echo "::error::Internal identifiers or tool attribution in the title, body or commit messages:"
            printf '%s\n' "$hits"
            fail=1
          fi

          exit "$fail"
